name: Build Release

# Runs when a version tag (e.g. v1.0.2) is pushed and builds a draft release from exactly that
# commit. The tag is the only source of the version: go build stamps it into the binary, and
# CHANGELOG.md must have a section for it. It can also be re-run by hand from the Actions tab,
# but only with a tag selected under "Use workflow from".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 1. Broadly secure the workflow by defaulting all tokens to read-only
permissions: read-all

jobs:
  build:
    name: Build & Test Artifacts
    runs-on: ubuntu-26.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # A manual run can pick any branch; only a tag pins the release to one commit.
      - name: Require A Version Tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Releases are built from a version tag. Push one (git tag vX.Y.Z && git push origin vX.Y.Z) or pick a tag under \"Use workflow from\"."
            exit 1
          fi

      - name: Checkout Code
        # Pinned to actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked before the slow steps, so a malformed tag or a missing changelog fails in seconds.
      - name: Get Version From Tag
        id: version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a release version; use vX.Y.Z, e.g. v1.0.4."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${VERSION//./\\.}\]( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section. Add the release notes, merge them, then tag that commit."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Set up Go
        # Pinned to actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Environment & OS
        run: |
          lsb_release -a
          go version

      # Same targets as a local `make`, so releases are held to the same bar as CI.
      - name: Check Formatting, go fix & Vet
        run: make check

      - name: Scan For Known Vulnerabilities
        run: make vuln

      - name: Run Tests
        run: make test

      - name: Compile Static Linux Binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/hmj-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/hmj-linux-arm64 .

      # go build stamps the version only for a clean checkout of the tagged commit; anything else
      # reports "dev", so prove both binaries carry the tag and the amd64 one prints it.
      - name: Verify Binary Version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for arch in amd64 arm64; do
            stamped=$(go version -m "dist/hmj-linux-${arch}" | awk '$1 == "mod" { print $3 }')
            if [ "$stamped" != "v${VERSION}" ]; then
              echo "::error::dist/hmj-linux-${arch} is stamped '${stamped}', expected v${VERSION}."
              exit 1
            fi
          done
          reported=$(dist/hmj-linux-amd64 --version)
          echo "$reported"
          case "$reported" in
            "HMJ Agent ${VERSION} ("*) ;;
            *)
              echo "::error::hmj --version printed '${reported}', expected 'HMJ Agent ${VERSION} (...)'."
              exit 1
              ;;
          esac

      - name: Package Release Tarballs
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          for arch in amd64 arm64; do
            pkg="dist/hmj-${VERSION}-linux-${arch}"
            mkdir -p "${pkg}/hmj"
            install -m 0755 "dist/hmj-linux-${arch}" "${pkg}/hmj/hmj"

            # Checksum of the binary inside the archive
            (
              cd "${pkg}/hmj" \
                && sha256sum hmj > SHA256SUMS.txt
            )
            tar -czf "${pkg}.tar.gz" -C "${pkg}" hmj
          done

          # Checksums for verifying downloaded tarballs
          (
            cd dist \
              && sha256sum hmj-*.tar.gz > SHA256SUMS.txt
          )

      - name: Extract Changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \\[*${VERSION}\\]*/{flag=1; next} /^## /{flag=0} /^\\[[0-9a-zA-Z._-]+\\]:/{flag=0} flag" CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release v${VERSION}" > RELEASE_NOTES.md
          fi

      - name: Upload Build Artifacts & Notes
        # Pinned to actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hmj-${{ steps.version.outputs.version }}-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            RELEASE_NOTES.md
          retention-days: 7

  publish:
    name: Create Draft Release
    runs-on: ubuntu-26.04
    needs: build
    
    # 2. Grant write permissions strictly to this isolated job
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        # Pinned to actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hmj-${{ needs.build.outputs.version }}-linux
          path: release-artifacts

      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          
          # Run the creation entirely within the downloaded artifact directory
          cd release-artifacts

          # Flatten dist/ if download-artifact preserved the subdirectory
          if [ -d dist ]; then
            mv dist/* .
            rmdir dist 2>/dev/null || true
          fi

          ls -la

          gh release create "v${VERSION}" \
            *.tar.gz \
            SHA256SUMS.txt \
            --verify-tag \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --draft
